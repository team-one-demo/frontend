name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: node:23.4.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

  sast-scan:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  build-and-sign-image:
    runs-on: ubuntu-latest
    needs: sast-scan
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          # Generate image tags
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_LOWER}"
          
          # Create unique tag based on ref and SHA
          REF_SLUG=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9_-]/-/g')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          UNIQUE_TAG="${REF_SLUG}-${SHORT_SHA}-${{ github.run_id }}"
          
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "UNIQUE_TAG=${UNIQUE_TAG}" >> $GITHUB_OUTPUT
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "unique_tag=${UNIQUE_TAG}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.IMAGE_NAME }}:${{ steps.meta.outputs.UNIQUE_TAG }}
            ${{ steps.meta.outputs.IMAGE_NAME }}:latest
          build-args: |
            VITE_GITLAB_CLIENT_ID=${{ secrets.GITLAB_CLIENT_ID }}
            VITE_GITLAB_REDIRECT_URI=${{ secrets.GITLAB_REDIRECT_URI }}
            NODE_OPTIONS=--max-old-space-size=4096
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the container image
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          IMAGE_NAME="${{ steps.meta.outputs.IMAGE_NAME }}"
          UNIQUE_TAG="${{ steps.meta.outputs.UNIQUE_TAG }}"
          
          # Install jq for JSON parsing
          sudo apt-get update && sudo apt-get install -y jq
          
          # Get the image digest
          IMAGE_DIGEST=$(docker buildx imagetools inspect "${IMAGE_NAME}:${UNIQUE_TAG}" --format '{{json .Manifest}}' | jq -r '.digest')
          IMAGE_WITH_DIGEST="${IMAGE_NAME}@${IMAGE_DIGEST}"
          
          echo "Signing image: ${IMAGE_WITH_DIGEST}"
          cosign sign --yes "${IMAGE_WITH_DIGEST}"
